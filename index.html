<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ticket note — アイマス ライブ参戦ログ</title>
<meta name="description" content="アイドルマスターのライブ参戦記録から、楽曲・編成・オリメン回収の統計を出すファンメイドツール">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/app.css?v=20261005234500">
</head>
<body>

<header class="masthead">
  <div class="mast-inner">
    <div class="logo">
      <span class="logo-jp">Ticket note</span>
      <span class="logo-en">IM@S LIVE LOG</span>
    </div>
    <button id="scopeBtn" class="scope-chip" type="button" aria-live="polite">現地のみ</button>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#/lives" data-tab="lives">半券</a>
    <a href="#/stats" data-tab="stats">統計</a>
    <a href="#/songs" data-tab="songs">楽曲</a>
    <a href="#/prep" data-tab="prep">準備</a>
    <a href="#/heatmap" data-tab="heatmap">出演マトリクス</a>
    <a href="#/tier" data-tab="tier">ティア</a>
    <a href="#/settings" data-tab="settings">設定</a>
  </nav>
</header>

<main id="view" class="view">
  <p class="loading">データを読んでいます…</p>
</main>

<footer class="foot">
  <p>非公式ファンメイドツール。THE IDOLM@STER は株式会社バンダイナムコエンターテインメントの登録商標です。</p>
</footer>

<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="penlight-stage" aria-hidden="true"></div>

<script>
/* モジュールの読み込みや起動に失敗したとき、「読んでいます…」のまま黙って止まらないようにする */
(function(){
  function show(msg){
    var v = document.getElementById('view');
    if(!v || !v.querySelector('.loading')) return;
    v.innerHTML = '<div class="warn"><b>アプリを起動できませんでした。</b><br>' +
      String(msg).replace(/[<&]/g, function(c){ return c === '<' ? '&lt;' : '&amp;'; }) +
      '<br>古いファイルがブラウザに残っている可能性があります。<br>' +
      '<button class="btn" type="button" onclick="location.reload()" style="margin-top:8px">再読み込み</button></div>';
  }
  window.addEventListener('error', function(e){ show(e.message || '読み込みエラー'); });
  window.addEventListener('unhandledrejection', function(e){ show((e.reason && e.reason.message) || e.reason || '読み込みエラー'); });
})();
</script>
<script type="importmap">
{
  "imports": {
    "./assets/js/db.js": "./assets/js/db.js?v=20261005234500",
    "./assets/js/store.js": "./assets/js/store.js?v=20261005234500",
    "./assets/js/stats.js": "./assets/js/stats.js?v=20261005234500",
    "./assets/js/csv.js": "./assets/js/csv.js?v=20261005234500",
    "./assets/js/text.js": "./assets/js/text.js?v=20261005234500",
    "./assets/js/card.js": "./assets/js/card.js?v=20261005234500"
  }
}
</script>
<script type="module" src="./assets/js/main.js?v=20261005234500"></script>
</body>
</html>
